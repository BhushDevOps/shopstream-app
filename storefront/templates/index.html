<!DOCTYPE html>
<html>
<head><title>ShopStream</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
  li { margin: 6px 0; }
  .err { color: #a00; } .pod { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h1>ShopStream</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <ul>
  {% for p in products %}
    <li>{{ p.name }} — ${{ p.price }}</li>
  {% endfor %}
  </ul>
  <p class="pod">served by pod: {{ pod }}</p>
</body>
</html>
